; CHIM Gore - game-side settings
; Server-side policy (chance, cooldown, minimum gore score, wording) lives in the
; CHIM web UI: Server Plugins -> chim_gore -> Plugin Page.

[General]
; 1 = on, 0 = off
bEnabled = 1
; Write each gory kill into CHIM's event log so nearby NPCs remember it.
bLogEachEvent = 1
; After combat ends, ask one follower to react to the fight.
bReflectAfterCombat = 1
; Also count decapitations/dismemberments done by the player (not only followers).
bIncludePlayerKills = 1
; Show small on-screen notifications (for testing).
bDebugNotifications = 0
; 0 = errors, 1 = warnings, 2 = info, 3 = debug. Log: Documents/My Games/Skyrim Special Edition/SKSE/CHIMGore.log
iLogLevel = 2

[Timing]
; Seconds to wait after a death before checking what was severed (heads keep flying for a moment).
fCheckDelaySeconds = 2.5
; Random delay after combat ends before the follower reacts. Resets if combat resumes.
fReflectDelayMinSeconds = 8
fReflectDelayMaxSeconds = 20

[Range]
; A follower must be within this distance of the player to react (70 units ~ 1 meter).
fFollowerRangeUnits = 3000
; Search radius for the severed head (Next-Gen Decapitations).
fHeadSearchRadiusUnits = 2500

[Text]
; How many gory moments of one fight are described to the follower.
iMaxSummaryLines = 3
