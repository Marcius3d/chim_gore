; CHIM Gore - game-side fallback settings
;
; When the CHIM server is running, the settings on the CHIM web page
; (Server Plugins -> CHIM Gore -> Plugin Page) override this file.
; This file is only used while the server plugin cannot be reached.
;
; Log file: Documents\My Games\Skyrim Special Edition\SKSE\chim-gore.log

[General]
; 1 = on, 0 = off
bEnabled = 1
; Debug: on-screen "CHIM-gore: request sent / failed / successful" messages and a detailed log.
bDebug = 0
; Write each gory kill into CHIM's event memory so nearby NPCs remember it.
bLogEachEvent = 1
; After combat ends, ask one follower to react to the fight.
bReflectAfterCombat = 1
; Also count decapitations and dismemberments done by the player (not only by followers).
bIncludePlayerKills = 1
; 0 = errors, 1 = warnings, 2 = info, 3 = debug (debug mode always logs at level 3)
iLogLevel = 2

[Mods]
; Supported mods are detected automatically. Set to 0 to ignore one of them.
bUseNextGenDecapitations = 1
bUseDismemberingFramework = 1

[Timing]
; Seconds to wait after a death before checking what was severed.
fCheckDelaySeconds = 2.5
; Random delay after combat ends before the follower reacts. Resets if combat resumes.
fReflectDelayMinSeconds = 8
fReflectDelayMaxSeconds = 20

[Range]
; A follower must be within this distance of the player to react (70 units ~ 1 meter).
fFollowerRangeUnits = 3000
; Search radius for the severed head (Next-Gen Decapitations).
fHeadSearchRadiusUnits = 2500

[Text]
; How many gory moments of one fight are described to the follower.
iMaxSummaryLines = 3

[Server]
; Leave empty: the CHIM server address is taken from AIAgent.ini or found automatically,
; the same way CHIM does it. Set only if CHIM Gore cannot reach the server.
sServer =
iPort =
